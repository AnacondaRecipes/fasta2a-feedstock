{% set name = "fasta2a" %}
{% set version = "2.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f044485ddb7d8904a58b3de2ae924ff9d227be142f79c489e54c95acc2a660c9

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - hatchling
    - uv-dynamic-versioning >=0.7.0
  run:
    - python
    - opentelemetry-api >=1.28.0
    - pydantic >=2.10
    - starlette >0.29.0
    - eval-type-backport >=0.2.2  # [py<=39]
  run_constrained:
    # logfire extra (upstream pyproject.toml [project.optional-dependencies].logfire)
    - logfire >=2.3
    # pydantic-ai
    - pydantic-ai-slim >=2.40.0  # [py>=310]

# No tests run because asgi_lifespan not a part of anaconda main channel.
# E   ModuleNotFoundError: No module named 'asgi_lifespan'
test:
  imports:
    - fasta2a
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/pydantic/fasta2a
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Convert an AI Agent into an A2A server
  description: |
    fasta2a turns an AI Agent into an A2A (Agent-to-Agent protocol) server.
    Built on Starlette; integrates with pydantic-ai and other agent
    frameworks. Optional logfire integration for observability.
  doc_url: https://github.com/datalayer/fasta2a/blob/main/README.md
  dev_url: https://github.com/pydantic/fasta2a

extra:
  recipe-maintainers:
    - moritzwilksch
    - xkong-anaconda
